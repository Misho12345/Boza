name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test-linux:
    name: Linux (Ubuntu 22.04, GCC 13)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            curl \
            zip \
            unzip \
            tar \
            git

      - name: Install GCC 13
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Verify compiler version
        run: |
          gcc --version
          g++ --version
          cmake --version

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6b2ebcd8a4f886e46cba4906da684c2e0ecac7b3'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Configure CMake
        run: |
          cmake --preset Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset Release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Run tests
        run: ctest --preset unit:Release --output-on-failure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: build/Release/Testing/Temporary/LastTest.log

  build-and-test-windows:
    name: Windows (MSVC 2022)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6b2ebcd8a4f886e46cba4906da684c2e0ecac7b3'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Configure CMake
        run: cmake --preset Release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset Release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Run tests
        run: ctest --preset unit:Release --output-on-failure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: build/Release/Testing/Temporary/LastTest.log

  build-and-test-macos:
    name: macOS (Clang, Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6b2ebcd8a4f886e46cba4906da684c2e0ecac7b3'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Configure CMake
        run: cmake --preset Release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset Release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Run tests
        run: ctest --preset unit:Release --output-on-failure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: build/Release/Testing/Temporary/LastTest.log

  debug-build-linux:
    name: Debug Build (Linux, GCC 13)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            curl \
            zip \
            unzip \
            tar \
            git

      - name: Install GCC 13
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Install Vulkan SDK
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6b2ebcd8a4f886e46cba4906da684c2e0ecac7b3'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Configure CMake
        run: |
          cmake --preset Debug \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset Debug
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Run tests
        run: ctest --preset unit:Debug --output-on-failure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug-linux
          path: build/Debug/Testing/Temporary/LastTest.log

  sanitizers:
    name: Sanitizers (Linux, Debug)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            curl \
            zip \
            unzip \
            tar \
            git

      - name: Install GCC 13
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Install Vulkan SDK
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6b2ebcd8a4f886e46cba4906da684c2e0ecac7b3'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Configure CMake with ${{ matrix.sanitizer }}
        run: |
          SANITIZER_FLAG=""
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            SANITIZER_FLAG="-DBOZA_ENABLE_ASAN=ON"
          elif [ "${{ matrix.sanitizer }}" = "ubsan" ]; then
            SANITIZER_FLAG="-DBOZA_ENABLE_UBSAN=ON"
          fi
          cmake --preset Debug \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            $SANITIZER_FLAG
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset Debug
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Run tests
        run: ctest --preset unit:Debug --output-on-failure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          ASAN_OPTIONS: detect_leaks=1:symbolize=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.sanitizer }}
          path: build/Debug/Testing/Temporary/LastTest.log

  code-coverage:
    name: Code Coverage (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            curl \
            zip \
            unzip \
            tar \
            git \
            gcovr

      - name: Install GCC 13
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Install Vulkan SDK
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6b2ebcd8a4f886e46cba4906da684c2e0ecac7b3'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Configure CMake with coverage
        run: |
          cmake --preset Debug \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset Debug
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Run tests
        run: ctest --preset unit:Debug --output-on-failure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Generate coverage report
        run: |
          gcovr --root . \
            --exclude 'vcpkg/*' \
            --exclude 'build/*' \
            --exclude 'tests/*' \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --print-summary \
            --xml coverage.xml \
            --html coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.html

  build-summary:
    name: Build Summary
    runs-on: ubuntu-22.04
    needs: [build-and-test-linux, build-and-test-windows, build-and-test-macos, debug-build-linux, sanitizers]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-and-test-linux.result }}" != "success" ] || \
             [ "${{ needs.build-and-test-windows.result }}" != "success" ] || \
             [ "${{ needs.build-and-test-macos.result }}" != "success" ] || \
             [ "${{ needs.debug-build-linux.result }}" != "success" ] || \
             [ "${{ needs.sanitizers.result }}" != "success" ]; then
            echo "❌ Some builds failed"
            exit 1
          else
            echo "✅ All builds passed"
          fi