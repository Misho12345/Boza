name: CI - Unit Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    env:
      BOZA_CMAKE_COMMON: >-
        -DBOZA_BUILD_TESTS=ON
        -DBOZA_ENABLE_OPENGL=OFF
        -DBOZA_ENABLE_VULKAN=ON
        -DBOZA_ENABLE_METAL=OFF
        -DBOZA_ENABLE_DIRECTX11=OFF
        -DBOZA_ENABLE_DIRECTX12=OFF
        -DBOZA_ENABLE_OPENAL=OFF
        -DBOZA_ENABLE_XAUDIO2=OFF
        -DBOZA_ENABLE_COREAUDIO=OFF
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      VCPKG_FEATURE_FLAGS: manifests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev pkg-config
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk

      - name: Setup CMake 3.30+
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.5'

      - name: Select vcpkg triplet and root
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            VCPKG_ROOT_PATH="${{ runner.temp }}/vcpkg"
            echo "VCPKG_DEFAULT_TRIPLET=x64-windows" >> "$GITHUB_ENV"
            echo "VCPKG_ROOT=${VCPKG_ROOT_PATH}" >> "$GITHUB_ENV"
            echo "VCPKG_ROOT_UNIX=$(echo $VCPKG_ROOT_PATH | sed 's|\\|/|g')" >> "$GITHUB_ENV"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "VCPKG_DEFAULT_TRIPLET=arm64-osx" >> "$GITHUB_ENV"
            echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"
            echo "VCPKG_ROOT_UNIX=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"
          else
            echo "VCPKG_DEFAULT_TRIPLET=x64-linux" >> "$GITHUB_ENV"
            echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"
            echo "VCPKG_ROOT_UNIX=${{ runner.temp }}/vcpkg" >> "$GITHUB_ENV"
          fi

      - name: Cache vcpkg
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('**/vcpkg.json') }}

      - name: Bootstrap vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT_UNIX }}"
          cd "${{ env.VCPKG_ROOT_UNIX }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./bootstrap-vcpkg.bat -disableMetrics
          else
            ./bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Patch vcpkg for libogg download
        shell: bash
        run: |
          VCPKG_LIBOGG_PORTFILE=$(find "${{ env.VCPKG_ROOT_UNIX }}" -name "portfile.cmake" -path "*/libogg/*")
          if [ -f "$VCPKG_LIBOGG_PORTFILE" ]; then
            echo "Patching libogg portfile: $VCPKG_LIBOGG_PORTFILE"
            sed -i.bak 's|https://gitlab.xiph.org/xiph/ogg/-/archive/v${VERSION}/ogg-v${VERSION}.tar.gz|https://downloads.xiph.org/releases/ogg/libogg-${VERSION}.tar.gz|' "$VCPKG_LIBOGG_PORTFILE"
            sed -i.bak 's|ogg-v${VERSION}|libogg-${VERSION}|' "$VCPKG_LIBOGG_PORTFILE"
          else
            echo "libogg portfile not found, skipping patch."
          fi

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          $BOZA_CMAKE_COMMON

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          $BOZA_CMAKE_COMMON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --parallel

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build --output-on-failure
